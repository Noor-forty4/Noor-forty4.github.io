<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unblocked Games - Play Anywhere</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            color: white;
            overflow-x: hidden;
        }

        /* Animated background elements */
        .bg-animation { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; }
        .orb { position: absolute; border-radius: 50%; filter: blur(40px); opacity: 0.3; animation: float 6s ease-in-out infinite; }
        .orb1 { width: 200px; height: 200px; background: #00d4ff; top: -50px; left: -50px; animation-delay: 0s; }
        .orb2 { width: 300px; height: 300px; background: #ff006e; bottom: -100px; right: -100px; animation-delay: 2s; }
        .orb3 { width: 250px; height: 250px; background: #00ff88; top: 50%; right: 10%; animation-delay: 4s; }
        @keyframes float { 0%,100%{transform:translate(0,0);} 33%{transform:translate(30px,-30px);} 66%{transform:translate(-20px,20px);} }

        /* Floating Boxes */
        .floating-box {
            position: fixed; width: 120px; height: 120px;
            background: linear-gradient(135deg, rgba(0,212,255,0.2), rgba(255,0,110,0.2));
            border: 2px solid #00d4ff; border-radius: 15px; display:flex; align-items:center; justify-content:center;
            cursor:pointer; transition: all 0.3s ease; z-index: 10; text-decoration: none; font-size:2rem; font-weight:bold; color:#00ff88;
        }
        .floating-box:hover { transform: scale(1.15); box-shadow: 0 0 30px rgba(0,212,255,0.8), 0 0 60px rgba(255,0,110,0.5); border-color:#ff006e; }
        .box-top { top:20px; left:50%; transform:translateX(-50%); }
        .box-bottom { bottom:20px; left:50%; transform:translateX(-50%); }
        .box-left { left:20px; top:50%; transform:translateY(-50%); }
        .box-right { right:20px; top:50%; transform:translateY(-50%); }

        /* Responsive */
        @media (max-width:768px) {
            .floating-box { width:100px; height:100px; font-size:1.5rem; }
            .box-left { left:10px; }
            .box-right { right:10px; }
            .box-top, .box-bottom { left:50%; transform:translateX(-50%); }
        }
    </style>
</head>
<body>
    <div class="bg-animation">
        <div class="orb orb1"></div>
        <div class="orb orb2"></div>
        <div class="orb orb3"></div>
    </div>

    <!-- Floating Boxes (kept) -->
    <a href="#" class="floating-box box-top" data-box="1">1</a>
    <a href="#" class="floating-box box-bottom" data-box="2">2</a>
    <a href="#" class="floating-box box-left" data-box="3">3</a>
    <a href="#" class="floating-box box-right" data-box="4">4</a>

    <script>
        // Box URL configuration (kept)
        const boxLinks = {
            box1: "https://valoq.naturesciencenews.com",
            box2: "https://interesting-articles.pages.dev",
            box3: "https://alern.schoools.homes",
            box4: "https://classroom.poloniacruz.com"
        };

        document.querySelectorAll('.floating-box').forEach(box => {
            const boxNum = box.getAttribute('data-box');
            box.addEventListener('click', (e) => {
                e.preventDefault();
                const key = `box${boxNum}`;
                if (boxLinks[key] && boxLinks[key] !== "#") {
                    window.open(boxLinks[key], '_blank');
                } else {
                    alert(`Box ${boxNum} link not set yet!`);
                }
            });
        });
    </script>
</body>
</html>
