<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>TUFF - Play Anywhere</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%}
    body{
      font-family:Inter, Arial, sans-serif;
      background:linear-gradient(135deg,#0f1b36 0%,#08102a 60%,#041022 100%);
      color:#dffcf1;overflow:hidden;
    }

    /* Header */
    .site-header{
      position:fixed;left:0;right:0;top:18px;z-index:20;display:flex;flex-direction:column;align-items:center;gap:6px;
    }
    .site-title{
      font-weight:800;font-size:40px;letter-spacing:4px;
      background:linear-gradient(90deg,#00d4ff,#ff006e,#00ff88);
      -webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 6px 30px rgba(0,212,255,0.08);
      transform:translateZ(0);
    }
    .site-sub{
      font-size:13px;color:#9fe6d5;opacity:0.9;padding:6px 12px;border-radius:999px;border:1px solid rgba(0,212,255,0.06);
      background:linear-gradient(180deg,rgba(255,255,255,0.02),transparent);
    }

    /* Made by text under title */
    .made-by{font-size:14px;color:#bffbe8;font-weight:600;opacity:0.95}

    /* Animated orbs */
    .bg-animation{position:fixed;inset:0;z-index:0;pointer-events:none}
    .orb{position:absolute;border-radius:50%;filter:blur(36px);opacity:0.28;mix-blend-mode:screen}
    .orb1{width:260px;height:260px;background:#00d4ff;left:-90px;top:-60px}
    .orb2{width:360px;height:360px;background:#ff006e;right:-120px;bottom:-120px}
    .orb3{width:300px;height:300px;background:#00ff88;right:12%;top:40%}

    @keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-24px)}}
    .orb{animation:floaty 8s ease-in-out infinite}

    /* Centered row */
    .box-row{position:relative;z-index:5;min-height:100vh;display:flex;align-items:center;justify-content:center;gap:28px;padding:120px 20px}

    .floating-box{
      width:150px;height:150px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;
      text-decoration:none;color:#e8fff6;background:linear-gradient(180deg,rgba(0,212,255,0.05),rgba(255,0,110,0.02));border:2px solid rgba(0,212,255,0.14);
      box-shadow:0 8px 30px rgba(0,0,0,0.45), inset 0 -6px 20px rgba(0,0,0,0.08);
      transition:transform .22s ease,box-shadow .22s ease,border-color .22s ease;backdrop-filter: blur(6px);
      text-align:center;padding:8px;font-weight:700;font-size:16px;letter-spacing:1px
    }
    .floating-box:hover{transform:translateY(-10px) scale(1.04);border-color:#ff006e;box-shadow:0 18px 60px rgba(0,212,255,0.06)}
    .floating-box .label{font-size:14px;color:#bffbe8;margin-top:8px;font-weight:700}

    /* Chat panel - always visible */
    .chat-panel{position:fixed;right:20px;bottom:20px;width:320px;max-width:calc(100% - 40px);z-index:40;background:linear-gradient(180deg,rgba(8,16,34,0.95),rgba(2,6,16,0.95));border:1px solid rgba(0,212,255,0.06);border-radius:12px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,0.6)}
    .chat-header{padding:12px 14px;background:linear-gradient(90deg,rgba(0,212,255,0.03),rgba(255,0,110,0.02));display:flex;gap:8px;align-items:center;justify-content:space-between}
    .chat-header h4{font-size:14px;margin:0;color:#c6fff0}
    .chat-lock{font-size:12px;color:#9fdccf;padding:6px 8px;border-radius:8px;background:rgba(0,0,0,0.12)}
    .chat-body{padding:10px;max-height:260px;overflow:auto;display:flex;flex-direction:column;gap:8px}
    .msg{padding:8px 10px;border-radius:10px;max-width:85%;font-size:13px}
    .msg.user{align-self:flex-end;background:linear-gradient(180deg,#00d4ff14,#00d4ff06);border:1px solid rgba(0,212,255,0.12);color:#dffcf1}
    .msg.bot{align-self:flex-start;background:linear-gradient(180deg,#2b2f45,#141827);border:1px solid rgba(255,255,255,0.02);color:#d7efe9}
    .chat-footer{display:flex;gap:8px;padding:10px;border-top:1px solid rgba(255,255,255,0.02)}
    .chat-input{flex:1;padding:10px;border-radius:8px;border:1px solid rgba(255,255,255,0.03);background:transparent;color:#eafff5}
    .chat-send{background:#00d4ff;color:#001; padding:8px 10px;border-radius:8px;border:none;font-weight:700;cursor:pointer}

    .small-muted{font-size:12px;color:#9fdccf;padding:8px;text-align:center}

    @media (max-width:640px){.box-row{padding:100px 12px;flex-direction:column;gap:18px}.chat-panel{right:10px;left:10px;width:auto}}
  </style>
</head>
<body>
  <div class="bg-animation">
    <div class="orb orb1"></div>
    <div class="orb orb2"></div>
    <div class="orb orb3"></div>
  </div>

  <header class="site-header">
    <div class="site-title">🎮 TUFF</div>
    <div class="site-sub made-by">Made by Muhanad</div>
  </header>

  <main class="box-row" role="main">
    <a class="floating-box" href="https://valoq.naturesciencenews.com" target="_blank" rel="noopener noreferrer">
      Proxy 1
      <div class="label">valoq...</div>
    </a>

    <a class="floating-box" href="https://interesting-articles.pages.dev" target="_blank" rel="noopener noreferrer">
      Proxy 2
      <div class="label">interesting...</div>
    </a>

    <a class="floating-box" href="https://alern.schoools.homes" target="_blank" rel="noopener noreferrer">
      Proxy 3
      <div class="label">alern...</div>
    </a>

    <a class="floating-box" href="https://classroom.poloniacruz.com" target="_blank" rel="noopener noreferrer">
      Proxy 4
      <div class="label">classroom...</div>
    </a>
  </main>

  <!-- Chat panel for reports/requests (always visible) -->
  <aside id="chatPanel" class="chat-panel" aria-label="Site chat / feedback">
    <div class="chat-header"><h4>Site Chat — Report or Request</h4><div class="chat-lock">Always Open</div></div>
    <div class="chat-body" id="chatBody">
      <div class="small-muted">No inappropriate content or cursing allowed. Messages failing filter will be blocked.</div>
    </div>
    <div class="chat-footer">
      <input id="chatInput" class="chat-input" placeholder="Describe an issue or request..." aria-label="Chat input" />
      <button id="chatSend" class="chat-send">Send</button>
    </div>
  </aside>

  <script>
    // Simple chat + filter (client-side only). Stores messages in-memory.
    const banned = ['fuck','shit','bitch','asshole','cunt','nigger','fag','dick','piss','damn'];

    const chatBody = document.getElementById('chatBody');
    const input = document.getElementById('chatInput');
    const send = document.getElementById('chatSend');
    const chatPanel = document.getElementById('chatPanel');

    function cleanText(t){ return t.toLowerCase().replace(/[^a-z0-9\s]/g,' ').replace(/\s+/g,' ').trim(); }
    function containsBanned(text){ const t = cleanText(text); if(!t) return false; const words = t.split(' '); for(const b of banned){ if(words.includes(b)) return true; } return false; }
    function appendMessage(text, who){ const el = document.createElement('div'); el.className = 'msg ' + (who==='user'?'user':'bot'); el.textContent = text; chatBody.appendChild(el); chatBody.scrollTop = chatBody.scrollHeight; }

    function botReply(userText){ const t = cleanText(userText); if(/error|broken|not working|can't|cant|crash|down|problem/.test(t)){ appendMessage('Thanks — I recorded this as an issue. Please include any steps to reproduce if available.', 'bot'); } else if(/add|please add|can you add|feature|could you/.test(t)){ appendMessage('Thanks — noted. I will queue this as a requested feature. Provide details if you can.', 'bot'); } else { appendMessage('Thanks — noted. If this is an issue, include details; if it\'s a request, describe what you want added.', 'bot'); } }

    send.addEventListener('click', ()=>{ sendMessage(); });
    input.addEventListener('keydown', (e)=>{ if(e.key==='Enter') sendMessage(); });

    function sendMessage(){ const v = input.value || ''; if(!v.trim()){ alert('Please type a message before sending.'); return; } if(containsBanned(v)){ appendMessage('Your message was blocked by the content filter. No cursing or inappropriate language allowed.', 'bot'); input.value=''; return; } if(v.trim().length < 3){ appendMessage('Message too short — please give more details.', 'bot'); input.value=''; return; } appendMessage(v, 'user'); input.value=''; setTimeout(()=>{ botReply(v); }, 450); }

    // Make chat panel persistent: if removed or hidden, restore it.
    const originalChat = chatPanel.cloneNode(true);

    const observer = new MutationObserver((mutations)=>{
      for(const m of mutations){
        if(m.type === 'childList'){
          if(!document.body.contains(chatPanel)){
            document.body.appendChild(originalChat);
            // rebind handlers on the restored panel
            rebindChatHandlers();
          }
        }
        if(m.type === 'attributes' && m.target === chatPanel){
          // ensure it's visible
          if(getComputedStyle(chatPanel).display === 'none' || chatPanel.style.visibility === 'hidden'){
            chatPanel.style.display = 'block';
            chatPanel.style.visibility = 'visible';
          }
        }
      }
    });

    observer.observe(document.body, { childList: true, subtree: true, attributes: true });

    function rebindChatHandlers(){
      const newBody = document.getElementById('chatBody');
      const newInput = document.getElementById('chatInput');
      const newSend = document.getElementById('chatSend');
      // reuse functions from above
      newSend.addEventListener('click', ()=>{ const e = new Event('click'); send.dispatchEvent(e); });
      newInput.addEventListener('keydown', (e)=>{ if(e.key==='Enter') send.dispatchEvent(new KeyboardEvent('keydown', {key:'Enter'})); });
    }

    // Prevent accidental context menu inside chat
    chatPanel.addEventListener('contextmenu', (e)=>{ e.preventDefault(); });

    // Extra defence: ensure the chat keeps high z-index
    setInterval(()=>{ if(parseInt(getComputedStyle(chatPanel).zIndex) < 30) chatPanel.style.zIndex = 40; }, 2000);
  </script>
</body>
</html>
