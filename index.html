<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unblocked Games - Play Anywhere</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            color: white;
            overflow-x: hidden;
        }

        /* Animated background elements */
        .bg-animation { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; }
        .orb { position: absolute; border-radius: 50%; filter: blur(40px); opacity: 0.3; animation: float 6s ease-in-out infinite; }
        .orb1 { width: 200px; height: 200px; background: #00d4ff; top: -50px; left: -50px; animation-delay: 0s; }
        .orb2 { width: 300px; height: 300px; background: #ff006e; bottom: -100px; right: -100px; animation-delay: 2s; }
        .orb3 { width: 250px; height: 250px; background: #00ff88; top: 50%; right: 10%; animation-delay: 4s; }
        @keyframes float { 0%,100%{transform:translate(0,0);} 33%{transform:translate(30px,-30px);} 66%{transform:translate(-20px,20px);} }

        /* Centered row for boxes */
        .box-row {
            position: relative;
            z-index: 10;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 24px;
            padding: 40px;
        }

        .floating-box {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 140px;
            height: 140px;
            background: linear-gradient(135deg, rgba(0,212,255,0.15), rgba(255,0,110,0.15));
            border: 2px solid #00d4ff;
            border-radius: 15px;
            text-decoration: none;
            font-size: 2rem;
            font-weight: bold;
            color: #00ff88;
            transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
            cursor: pointer;
        }

        .floating-box:hover {
            transform: translateY(-8px) scale(1.05);
            box-shadow: 0 8px 30px rgba(0,212,255,0.12), 0 16px 60px rgba(255,0,110,0.08);
            border-color: #ff006e;
            background: linear-gradient(135deg, rgba(0,212,255,0.28), rgba(255,0,110,0.18));
        }

        .box-label {
            font-size: 0.9rem;
            color: #bfeee2;
            margin-top: 8px;
            text-align: center;
        }

        /* Small screens */
        @media (max-width: 768px) {
            .box-row { gap: 14px; padding: 20px; }
            .floating-box { width: 100px; height: 100px; font-size: 1.4rem; }
        }
    </style>
</head>
<body>
    <div class="bg-animation">
        <div class="orb orb1"></div>
        <div class="orb orb2"></div>
        <div class="orb orb3"></div>
    </div>

    <!-- Boxes lined up in a row (centered) -->
    <div class="box-row">
        <a class="floating-box" href="https://valoq.naturesciencenews.com" target="_blank" rel="noopener noreferrer">1</a>
        <a class="floating-box" href="https://interesting-articles.pages.dev" target="_blank" rel="noopener noreferrer">2</a>
        <a class="floating-box" href="https://alern.schoools.homes" target="_blank" rel="noopener noreferrer">3</a>
        <a class="floating-box" href="https://classroom.poloniacruz.com" target="_blank" rel="noopener noreferrer">4</a>
    </div>

    <script>
        // Kept for future dynamic link updates if you want to change links via JS later.
        const boxLinks = {
            box1: "https://valoq.naturesciencenews.com",
            box2: "https://interesting-articles.pages.dev",
            box3: "https://alern.schoools.homes",
            box4: "https://classroom.poloniacruz.com"
        };
    </script>
</body>
</html>
